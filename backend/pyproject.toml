[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migue-api"
version = "0.1.0"
description = "API do SÓ NO MIGUÉ FC — estatísticas da pelada de quinta"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Autenticação (Fase 4). bcrypt é usado direto, sem passlib:
    # passlib ainda não é compatível com bcrypt >= 4.1.
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    # Upload de fotos (Fase 6).
    "python-multipart>=0.0.12",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
